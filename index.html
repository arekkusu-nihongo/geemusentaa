<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mots croisés en Japonais</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<h1>Mots croisés en Japonais</h1>

<div class="controls">

<select id="mode">
    <option value="romaji">Romaji</option>
    <option value="hiragana">Hiragana</option>
</select>

<label>
    Maximum de mots:
    <select id="wordCount">
        <option value="5">5</option>
        <option value="10">10</option>
        <option value="20">20</option>
        <option value="30">30</option>
        <option value="50" selected>50</option>
    </select>
</label>

<button id="generateBtn">Generate Crossword</button>
<button id="revealAllBtn">Révéler la grille</button>
<br>
<br>
<button id="checkLetterBtn">Vérifier la lettre</button>
<button id="checkWordBtn">Vérifier le mot</button>
<button id="checkBtn">Vérifer la grille</button>
<br>
<br>
<button id="revealLetterBtn">Révéler la letter</button>
<button id="revealWordBtn">Révéler le mot</button>
<br>
<br>
<label>
    <input type="checkbox" id="includeKnownWords">
    Inclure les mots qui ne sont PAS encore à étudier?
</label>
<br>
<br>
<button id="statsBtn">
    Stats
</button>
<button id="clearStatsBtn">
    Vider le cache de stats
</button>
<br>
<br>
<button id="exportPdfBtn">
    Export PDF
</button>

</div>

<div id="crossword"></div>

<div id="clues">
    <h2>Indices</h2>

    <!-- IMPORTANT: switched from OL to UL to avoid auto-numbering bugs -->
    <ul id="clueList"></ul>
</div>

<script src="app.js"></script>

</body>
</html>
