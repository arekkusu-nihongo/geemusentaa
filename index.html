<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Japanese Crossword</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<h1>Japanese Crossword</h1>

<div class="controls">

<select id="mode">
    <option value="romaji">Romaji</option>
    <option value="hiragana">Hiragana</option>
</select>

<button id="generateBtn">Generate Crossword</button>
<button id="checkBtn">Check All</button>
<button id="revealAllBtn">Reveal Puzzle</button>
<button id="checkLetterBtn">Check Letter</button>
<button id="checkWordBtn">Check Word</button>
<button id="revealLetterBtn">Reveal Letter</button>
<button id="revealWordBtn">Reveal Word</button>

</div>

<div id="crossword"></div>

<div id="clues">
    <h2>Clues</h2>

    <!-- IMPORTANT: switched from OL to UL to avoid auto-numbering bugs -->
    <ul id="clueList"></ul>
</div>

<script src="app.js"></script>

</body>
</html>
